<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading | Manoj Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030303;
      color: white;
      font-family: Arial, sans-serif;
    }

    .loading-content {
      width: 85%;
      max-width: 350px;
      text-align: center;
    }

    .loading-circle {
      width: 230px;
      height: 230px;
      max-width: 65vw;
      max-height: 65vw;
      position: relative;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-circle::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        #42f5ee 0deg,
        transparent 100deg,
        #42f5ee 200deg,
        transparent 300deg,
        #42f5ee 360deg
      );
      -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 5px),
        #000 calc(100% - 4px)
      );
      mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 5px),
        #000 calc(100% - 4px)
      );
      animation: spin 2s linear infinite;
    }

    .loading-tree {
      width: 76%;
      height: 76%;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 5px;
      margin: 0 0 12px;
    }

    h1 span {
      color: #42f5ee;
    }

    .subtitle {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .bar {
      height: 7px;
      background: #292929;
      border-radius: 20px;
      overflow: hidden;
    }

    #fill {
      width: 0;
      height: 100%;
      background: #42f5ee;
      box-shadow: 0 0 12px #42f5ee;
      transition: width .4s ease;
    }

    #percent {
      color: #42f5ee;
      margin-top: 14px;
      font-size: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fade-out {
      animation: fadeOut .7s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>

</head>

<body>
  <div class="loading-content" id="loader">
    <div class="loading-circle">
      <img
        src="assets/tree-loader.png"
        alt="Tree"
        class="loading-tree"
      >
    </div>

  </div>

  <script>
    const stages = [0, 10, 40, 75, 100];
    const fill = document.getElementById("fill");
    const percent = document.getElementById("percent");
    const loader = document.getElementById("loader");

    let index = 0;

    function runLoader() {
      if (index >= stages.length) {
        setTimeout(() => {
          loader.classList.add("fade-out");

          setTimeout(() => {
            window.location.replace("./index.html");
          }, 750);
        }, 300);

        return;
      }

      const value = stages[index++];

      fill.style.width = value + "%";
      percent.textContent = value + "%";

      setTimeout(runLoader, 650);
    }

    runLoader();
  </script>

</body>
</html>
